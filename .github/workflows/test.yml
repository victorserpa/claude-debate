# Runs the pull request's code: tests only. The checks that decide whether
# a PR may merge (commit rules, issue link, objection record) live in
# governance.yml and run from main, so a PR cannot edit them to pass.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  os:
    # Windows runs the same bash scripts through Git Bash, which is what
    # Claude Code itself requires there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: bash test/gate.test.sh
      - run: bash test/check-pr.test.sh
      - run: bash test/roles-in-sync.test.sh
      - run: bash test/precedents.test.sh
      - run: bash test/brief.test.sh
      - run: bash test/review.test.sh
      - run: bash test/debate.test.sh
  # The ruleset requires a check named "test": one job that passes only
  # when every system passed.
  test:
    needs: os
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.os.result }}" = success ]'
