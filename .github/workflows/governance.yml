# Merge gates for this repository. pull_request_target runs this file and
# the scripts as they are on main, never the pull request's code: a PR can
# not rewrite the rules it is judged by. Nothing here checks out or runs
# code from the PR; it reads the event and the GitHub API.
name: governance
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  commits:
    name: commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, main (the base), not the PR
      - name: PR title and every commit follow the commit rules
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          status=0
          printf '%s\n' "$TITLE" > /tmp/title
          bash scripts/check-commit-msg.sh /tmp/title || { echo "  in the PR title (squash merge uses it as the commit message)"; status=1; }
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate -q '.[] | .sha' | while read -r c; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$c" -q .commit.message > /tmp/msg
            case "$(head -1 /tmp/msg)" in "Merge "*) continue ;; esac
            bash scripts/check-commit-msg.sh /tmp/msg || { echo "  in commit $c"; exit 1; }
          done || status=1
          exit $status
  issue-link:
    name: issue-link
    runs-on: ubuntu-latest
    steps:
      - name: The PR closes an issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" | grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' && exit 0
          echo "::error title=issue-link::Link the issue this PR closes in the body (Closes #n). Open one first if it does not exist."
          exit 1
  record:
    name: record
    runs-on: ubuntu-latest
    steps:
      - uses: victorserpa/objection@v1
