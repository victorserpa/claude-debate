# Merge gates for this repository. pull_request_target runs this file and
# the scripts as they are on main, never the pull request's code: a PR can
# not rewrite the rules it is judged by. Nothing here checks out or runs
# code from the PR; it reads the event and the GitHub API.
#
# Check names are not proof of origin: a PR could add its own workflow
# with a job called "record". That is why outside PRs also need a code
# owner's approval (see SECURITY.md): the reviewer sees any workflow a PR
# adds before it can count.
name: governance
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
defaults:
  run:
    shell: bash
jobs:
  commits:
    name: commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, main (the base), not the PR
      - name: PR title, PR body and every commit follow the commit rules
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
          COUNT: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail
          status=0
          # Squash merge writes the title as the subject and the body as the
          # message, so both land on main.
          printf '%s\n' "$TITLE" > /tmp/title
          bash scripts/check-commit-msg.sh /tmp/title || { echo "  in the PR title"; status=1; }
          # Here-strings, not pipes: with pipefail, grep -q closing early
          # makes printf die of SIGPIPE on large bodies, and the check
          # would read as "not found".
          if grep -qi '^[[:space:]]*co-authored-by:' <<<"$BODY"; then
            echo "commit message rejected: Co-Authored-By in the PR body (it becomes the squash message)"; status=1
          fi
          # The API lists at most 250 commits; past that, nothing is checked.
          if [ "$COUNT" -ge 250 ]; then
            echo "::error title=commits::250 or more commits; split the PR so every commit can be checked."; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate \
            -q '.[] | [.sha, (.parents | length | tostring)] | join(" ")' > /tmp/commits
          while read -r sha parents; do
            [ "$parents" -gt 1 ] && continue   # real merge commits, by parent count
            gh api "repos/$GITHUB_REPOSITORY/commits/$sha" -q .commit.message > /tmp/msg
            bash scripts/check-commit-msg.sh /tmp/msg || { echo "  in commit $sha"; status=1; }
          done < /tmp/commits
          exit $status
  issue-link:
    name: issue-link
    runs-on: ubuntu-latest
    steps:
      - id: who
        name: Is this a Dependabot-only PR?
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Decided by content, not by who sent the event, and bound to the
          # event's own commits (not the PR head at call time): Dependabot
          # opened the PR, and EVERY commit, merges included, was authored by
          # dependabot[bot], committed by GitHub (web-flow) and verified. A
          # human amending a Dependabot commit keeps it as author but becomes
          # the committer, so it no longer counts; a human merge ("Update
          # branch", conflict resolution) is a human commit, so every check
          # runs ("@dependabot recreate" rebuilds a clean branch, dropping the edits).
          # Editing the title or body changes nothing here.
          only=false
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" > /tmp/compare.json
            total=$(jq '.total_commits' /tmp/compare.json)
            listed=$(jq '.commits | length' /tmp/compare.json)
            others=$(jq '[.commits[] | select(
                (.author.login // "") != "dependabot[bot]" or
                (.committer.login // "") != "web-flow" or
                (.commit.verification.verified | not))] | length' /tmp/compare.json)
            # compare lists at most 250 commits: past that, nothing is proven.
            if [ "$total" -gt 0 ] && [ "$total" -eq "$listed" ] && [ "$others" -eq 0 ]; then only=true; fi
          fi
          echo "dependabot_only=$only" >>"$GITHUB_OUTPUT"
          echo "dependabot_only=$only"
      - name: The PR closes an issue
        if: steps.who.outputs.dependabot_only != 'true'
        env:
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          re='(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+([[:alnum:]_.-]+/[[:alnum:]_.-]+)?(#[0-9]+|https://github\.com/[^/[:space:]]+/[^/[:space:]]+/issues/[0-9]+)'
          # Drop HTML comments first: GitHub does not link issues inside them.
          # Here-strings, not pipes, for the same SIGPIPE reason as above.
          text=$(perl -0pe 's/<!--.*?-->//gs' <<<"$BODY")
          grep -qiE "$re" <<<"$text" && exit 0
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "::error title=issue-link::This Dependabot PR has commits not made by Dependabot, so it needs an issue link and a record. Either link an issue and add a record, or comment \"@dependabot recreate\" to rebuild a clean Dependabot branch (this drops the other commits)."
          else
            echo "::error title=issue-link::Link the issue this PR closes in the body (Closes #n). Open one first if it does not exist."
          fi
          exit 1
  record:
    name: record
    runs-on: ubuntu-latest
    steps:
      # main's own action, not the v1 tag: a fix to the check guards this
      # repository as soon as it merges.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, main (the base), not the PR
      - id: who
        name: Is this a Dependabot-only PR?
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Decided by content, not by who sent the event, and bound to the
          # event's own commits (not the PR head at call time): Dependabot
          # opened the PR, and EVERY commit, merges included, was authored by
          # dependabot[bot], committed by GitHub (web-flow) and verified. A
          # human amending a Dependabot commit keeps it as author but becomes
          # the committer, so it no longer counts; a human merge ("Update
          # branch", conflict resolution) is a human commit, so every check
          # runs ("@dependabot recreate" rebuilds a clean branch, dropping the edits).
          # Editing the title or body changes nothing here.
          only=false
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" > /tmp/compare.json
            total=$(jq '.total_commits' /tmp/compare.json)
            listed=$(jq '.commits | length' /tmp/compare.json)
            others=$(jq '[.commits[] | select(
                (.author.login // "") != "dependabot[bot]" or
                (.committer.login // "") != "web-flow" or
                (.commit.verification.verified | not))] | length' /tmp/compare.json)
            # compare lists at most 250 commits: past that, nothing is proven.
            if [ "$total" -gt 0 ] && [ "$total" -eq "$listed" ] && [ "$others" -eq 0 ]; then only=true; fi
          fi
          echo "dependabot_only=$only" >>"$GITHUB_OUTPUT"
          echo "dependabot_only=$only"
      - uses: ./
        if: steps.who.outputs.dependabot_only != 'true'
  # The Action's own independent accuser, through the Gemini CLI: a second
  # model family on every PR, and a live run of the runner: gemini path.
  # Not a required check: a finding here is a claim to check, not a gate.
  # Skipped on body and title edits (nothing new to review) and on
  # Dependabot PRs (no access to the key).
  review:
    name: review (gemini)
    if: github.event.action != 'edited' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, main (the base), not the PR
      - uses: ./
        with:
          record: "false"
          review: "true"
          runner: gemini
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
