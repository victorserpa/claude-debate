name: Bug
description: Something does not work as documented.
labels: [bug]
body:
  - type: dropdown
    id: host
    attributes:
      label: Where
      options: [Claude Code, Codex CLI, Cursor, Gemini CLI, GitHub Copilot, GitHub check, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: For the gate, the exact command (or hook input) and the exit code.
    validations:
      required: true
