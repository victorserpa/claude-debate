name: Objection PR Trial
description: Fails a PR without an APPROVED /objection record for its head; can also run an independent accuser in CI.
author: Victor Serpa
branding:
  icon: alert-octagon
  color: red
inputs:
  review:
    description: "true runs an isolated accuser on the PR head in CI, with a key the agent never sees, and fails on its findings (see fail-on). Needs anthropic-api-key, or gemini-api-key with runner: gemini."
    default: "false"
  anthropic-api-key:
    description: Anthropic API key for the review (a repository secret).
    default: ""
  runner:
    description: "Which CLI runs the review: claude or gemini."
    default: claude
  gemini-api-key:
    description: Gemini API key for the review with runner gemini (a repository secret).
    default: ""
  gemini-model:
    description: "Gemini model for the review; empty uses the Gemini CLI's default."
    default: ""
  gemini-version:
    description: "The @google/gemini-cli version installed for runner gemini: pinned, like claude-version."
    default: "0.61.0"
  model:
    description: Claude model for the review (runner claude; runner gemini uses gemini-model).
    default: sonnet
  effort:
    description: Effort for the review (low, medium, high, xhigh, max; runner claude only).
    default: medium
  fail-on:
    description: "Which findings fail the review: blocker, high (BLOCKER or HIGH) or none (report only)."
    default: blocker
  claude-version:
    description: "The @anthropic-ai/claude-code version installed for the review: pinned, since a new CLI can change the flags review.sh passes."
    default: "2.1.278"
  record:
    description: "false skips the record check and runs only the review."
    default: "true"
runs:
  using: composite
  steps:
    - if: ${{ inputs.record != 'false' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/skills/objection/gate/check-pr.mjs"
    # Runs even when the record check failed: both results are worth seeing.
    - if: ${{ !cancelled() && inputs.review == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        OBJECTION_RUNNER: ${{ inputs.runner }}
        OBJECTION_GEMINI_MODEL: ${{ inputs.gemini-model }}
        GEMINI_VERSION: ${{ inputs.gemini-version }}
        OBJECTION_MODEL: ${{ inputs.model }}
        OBJECTION_EFFORT: ${{ inputs.effort }}
        OBJECTION_FAIL_ON: ${{ inputs.fail-on }}
        CLAUDE_VERSION: ${{ inputs.claude-version }}
      run: |
        if [ "$OBJECTION_RUNNER" = gemini ]; then
          npm install -g --silent "@google/gemini-cli@$GEMINI_VERSION"
        else
          npm install -g --silent "@anthropic-ai/claude-code@$CLAUDE_VERSION"
        fi
        bash "$GITHUB_ACTION_PATH/skills/objection/ci-review.sh"
