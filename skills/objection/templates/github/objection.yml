# Copy to .github/workflows/objection.yml, then make "record" a required
# status check in a ruleset (or branch protection) on your default branch.
#
# pull_request_target on purpose: it runs this file from the base branch,
# so a pull request cannot edit the check it is judged by. It is safe here
# because the action never checks out or runs the PR's code; it reads the
# event and the GitHub API.
name: objection
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: victorserpa/objection@v1
        # Optional: an accuser run here, with a key the agent never sees.
        # with:
        #   review: true
        #   anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
        #   # comment: true posts the findings as one PR comment, kept up to
        #   # date (add pull-requests: write to the permissions above)
        #   # or, with a Gemini key (free tier) instead:
        #   # runner: gemini
        #   # gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
