<rect width="940" height="488" rx="10" fill="#0d1117"/>
<circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
<text x="470" y="24" fill="#8b949e" text-anchor="middle" style="opacity:1">objection: a real debate on a toy cart</text>
<text class="l0" x="20" y="52" fill="#8b949e"># the agent added fixed-amount coupons to a cart; invariant: a total is never negative</text>
<text class="l1" x="20" y="74" fill="#e6edf3">$ bash debate.sh main &quot;Add fixed-amount coupons&quot;</text>
<text class="l2" x="20" y="96" fill="#8b949e">objection: accuser used 2708 input + 632 output tokens ($0.010)</text>
<text class="l3" x="20" y="118" fill="#8b949e">objection: defender used 3168 input + 292 output tokens ($0.008)</text>
<text class="l4" x="20" y="140" fill="#e6edf3">findings: 1 BLOCKER, 1 HIGH, 1 MEDIUM, 0 LOW</text>
<text class="l5" x="20" y="162" fill="#ff7b72"> 1 BLOCKER  cart.js:10  $10 off a $4 cart: total = -600 (invariant broken)</text>
<text class="l6" x="20" y="184" fill="#ffa657"> 2 HIGH     cart.js:10  amount: 0 falls through to percent: total = NaN</text>
<text class="l7" x="20" y="206" fill="#79c0ff"> defender:  UPHELD both: no clamp anywhere (cart.js:4)</text>
<text class="l8" x="20" y="228" fill="#e6edf3">$ gh pr create --base main --fill</text>
<text class="l9" x="20" y="250" fill="#ff7b72">[objection] Blocked: no /objection record for commit 2b5d414.</text>
<text class="l10" x="20" y="272" fill="#8b949e"># the agent fixes both, runs round 2 on the fix only</text>
<text class="l11" x="20" y="294" fill="#e6edf3">$ bash debate.sh --since 2b5d414 main</text>
<text class="l12" x="20" y="316" fill="#ffa657"> 1 HIGH     cart.js:10  amount: NaN still passes the check: total = NaN</text>
<text class="l13" x="20" y="338" fill="#8b949e"># fixed again; the session judges every finding, then stamps the record</text>
<text class="l14" x="20" y="360" fill="#e6edf3">$ bash stamp.sh record.md</text>
<text class="l15" x="20" y="382" fill="#7ee787">record stored for 69e9b18   VERDICT: APPROVED</text>
<text class="l16" x="20" y="404" fill="#e6edf3">$ gh pr create --base main --fill</text>
<text class="l17" x="20" y="426" fill="#7ee787">(allowed: gh runs and opens the PR)</text>
<text class="l18" x="20" y="448" fill="#e3b341">3 real bugs caught before the PR existed: 2 rounds, $0.041 of reviewers</text>
</svg>
